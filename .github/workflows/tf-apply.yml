# Topic 20 (apply side) — the human gate.
# Takes the tf-pr run id + commit SHA, downloads EXACTLY that plan artifact,
# and applies it inside the lab-apply environment: required reviewer + 1-min
# wait timer fire BEFORE the job gets the write token. If state moved since
# the plan was saved, terraform refuses the stale plan — that refusal is the
# Topic 20 money demo.
name: tf-apply

on:
  workflow_dispatch:
    inputs:
      plan_run_id:
        description: "Run id of the tf-pr workflow that produced the plan"
        required: true
      sha:
        description: "Commit SHA the plan artifact is keyed by"
        required: true

permissions:
  contents: read
  actions: read

jobs:
  apply:
    name: apply pinned plan (human-gated)
    runs-on: ubuntu-latest
    environment: lab-apply           # required reviewer + wait timer live here
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}   # write token
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_account_id: ${{ vars.CF_ACCOUNT_ID }}
      TF_VAR_zone_name: ${{ vars.LAB_ZONE }}
      TF_VAR_incident_mode: ${{ vars.INCIDENT_MODE || 'none' }}
    defaults:
      run:
        working-directory: infra/envs/lab
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}     # apply the code the plan was made from
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
      - name: download the EXACT plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ inputs.sha }}
          run-id: ${{ inputs.plan_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: infra/envs/lab/
      - name: init (R2 backend)
        run: terraform init -input=false -backend-config=../../backends/lab.s3.tfbackend
      - name: apply the pinned plan — NOT a fresh plan
        run: terraform apply -input=false plan-${{ inputs.sha }}.tfplan
