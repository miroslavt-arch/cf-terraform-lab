# Topic 20 (apply side) — THE HUMAN GATE.
# Downloads the exact plan artifact tf-pr produced and applies it inside the
# lab-apply environment: 1-minute wait timer + required reviewer fire BEFORE
# the job is handed the write token.
name: tf-apply

on:
  workflow_dispatch:
    inputs:
      plan_run_id:
        description: "Run id of the tf-pr workflow that produced the plan"
        required: true
      sha:
        description: "Commit SHA the plan artifact is keyed by"
        required: true

permissions:
  contents: read
  actions: read

jobs:
  apply:
    name: apply pinned plan (human-gated)
    runs-on: ubuntu-latest
    environment: lab-apply           # required reviewer + wait timer live here
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}   # write token
      TF_VAR_zone_name: ${{ vars.LAB_ZONE }}
    defaults:
      run:
        working-directory: infra/envs/ci-demo
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}     # apply the code the plan was made from
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false
      - name: download the EXACT plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ inputs.sha }}
          run-id: ${{ inputs.plan_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: infra/envs/ci-demo/
      - name: init
        run: terraform init -input=false
      - name: apply the pinned plan — NOT a fresh plan
        run: terraform apply -input=false plan-${{ inputs.sha }}.tfplan
