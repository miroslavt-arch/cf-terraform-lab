# Topic 20 (plan side) + Topic 24 (tier-one gate).
# PRs get: offline unit tests -> fmt -> fragment lint -> a real plan with the
# READ-ONLY token -> OPA destroy guard -> plan artifact keyed by commit SHA ->
# summary comment. tf-apply.yml later replays EXACTLY that artifact.
name: tf-pr

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: tf-pr-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: tier-one tests (offline, no credentials)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - name: unit tests (mock provider — no token, no network)
        run: |
          terraform init -backend=false -input=false
          terraform test

  lint-fragments:
    name: conftest on WAF fragments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install conftest
        run: |
          curl -sL https://github.com/open-policy-agent/conftest/releases/download/v0.69.0/conftest_0.69.0_Linux_x86_64.tar.gz | tar xz conftest
          sudo mv conftest /usr/local/bin/
      - name: fragments must pass policy
        run: conftest test --policy policy infra/modules/waf-composed/rules/
      - name: bad fixture must FAIL policy (meta-test)
        run: |
          if conftest test --policy policy policy/fixtures/bad-app-team.yaml; then
            echo "::error::bad fixture passed policy — the lint is broken"; exit 1
          fi

  plan:
    name: plan (read-only token)
    needs: [unit, lint-fragments]
    runs-on: ubuntu-latest
    environment: lab-plan            # holds ONLY the read-only token
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PLAN }}
      TF_VAR_zone_name: ${{ vars.LAB_ZONE }}
    defaults:
      run:
        working-directory: infra/envs/ci-demo
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false
      - name: init
        run: terraform init -input=false
      - name: plan
        run: |
          terraform plan -input=false -no-color -out=plan-${{ github.event.pull_request.head.sha }}.tfplan | tee plan.txt
          terraform show -json plan-${{ github.event.pull_request.head.sha }}.tfplan > plan.json
      - name: OPA destroy guard — no plan may destroy a non-lab resource
        run: |
          curl -sL https://github.com/open-policy-agent/conftest/releases/download/v0.69.0/conftest_0.69.0_Linux_x86_64.tar.gz | tar xz conftest
          ./conftest test --policy ../../../policy --namespace destroy_guard plan.json
      - name: upload plan artifact (keyed by commit SHA)
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.event.pull_request.head.sha }}
          path: |
            infra/envs/ci-demo/plan-${{ github.event.pull_request.head.sha }}.tfplan
            infra/envs/ci-demo/plan.txt
          retention-days: 30
      - name: comment plan summary on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/envs/ci-demo/plan.txt', 'utf8');
            const tail = plan.length > 60000 ? plan.slice(-60000) : plan;
            const sha = context.payload.pull_request.head.sha;
            const body = [
              '### Terraform plan for `' + sha.slice(0,7) + '`',
              '',
              'Planned with the **read-only** token in the `lab-plan` environment.',
              'Artifact: `tfplan-' + sha + '` — the apply job replays THIS file, not a re-plan.',
              '',
              '<details><summary>plan output</summary>',
              '', '```', tail, '```',
              '</details>'
            ].join('\n');
            github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.payload.pull_request.number, body
            });
