# Topic 24, tier two — contract tests that touch the REAL lab zone with
# tftest-prefixed resources and auto-destroy them. Nightly + on demand only;
# never on PRs (tier one covers those offline).
name: contract-tests

on:
  # Tier two runs NIGHTLY and on demand - never on PRs, where tier one's
  # mocked tests already cover the logic offline.
  #
  # Note the real tension this exposes: these tests need a write token, and the
  # only place the write token lives is the lab-apply environment, which
  # requires human approval (Topic 20). So a scheduled run QUEUES for approval
  # rather than running unattended. That is a genuine trade-off, not an
  # oversight: unattended write automation and a human gate on writes are in
  # direct conflict, and you resolve it by giving CI its own narrowly-scoped
  # credential rather than by removing the gate.
  schedule:
    - cron: "42 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  contract:
    name: tier-two contract tests (real zone, tftest- prefix)
    runs-on: ubuntu-latest
    environment: lab-apply          # write token required to create/destroy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_contract_zone_id: ${{ vars.LAB_ZONE_ID }}
      TF_VAR_contract_zone_name: ${{ vars.LAB_ZONE }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
      - name: run contract tests
        run: |
          terraform init -backend=false -input=false
          terraform test -test-directory=tests/contract
