# Topic 27 — nightly drift baseline with author attribution.
# plan -detailed-exitcode: 0 = clean, 1 = error, 2 = DRIFT. On 2 we render the
# drift to JSON, correlate with the Cloudflare audit log, and name the actor
# in the job summary — then fail loudly so the drift is impossible to miss.
name: drift

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Optional -target=... address for a focused drift check"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  drift:
    name: detect drift (envs/lab)
    runs-on: ubuntu-latest
    environment: lab-plan          # read-only token is enough to see drift
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PLAN }}
      CLOUDFLARE_AUDIT_TOKEN: ${{ secrets.CLOUDFLARE_AUDIT_TOKEN }}
      CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_account_id: ${{ vars.CF_ACCOUNT_ID }}
      TF_VAR_zone_name: ${{ vars.LAB_ZONE }}
      TF_VAR_incident_mode: ${{ vars.INCIDENT_MODE || 'none' }}
    defaults:
      run:
        working-directory: infra/envs/lab
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false   # we need the raw exit code
      - name: init (R2 backend)
        run: terraform init -input=false -backend-config=../../backends/lab.s3.tfbackend
      - name: plan -detailed-exitcode
        id: plan
        run: |
          set +e
          terraform plan -input=false -no-color -detailed-exitcode -refresh-only \
            ${{ inputs.target != '' && format('-target={0}', inputs.target) || '' }} \
            -out=drift.tfplan | tee drift.txt
          code=${PIPESTATUS[0]}
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "1" ]; then exit 1; fi
          exit 0
      - name: render drift to JSON + attribute the author
        if: steps.plan.outputs.exitcode == '2'
        run: |
          terraform show -json drift.tfplan > drift.json
          python ../../../scripts/drift_report.py drift.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: fail loudly on drift
        if: steps.plan.outputs.exitcode == '2'
        run: |
          echo "::error::DRIFT DETECTED in envs/lab — see job summary for the actor attribution"
          exit 1
