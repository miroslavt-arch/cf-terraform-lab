# Topic 27 — nightly drift baseline with author attribution.
#
# Drift = live Cloudflare no longer matches the committed code.
#
# This lab has no remote Terraform state, so a runner cannot compare against
# "the state at last apply". It does something arguably better: it IMPORTS the
# live objects into an ephemeral state and compares them to the code as
# committed. Anything the plan proposes beyond the import itself is drift.
#
# Clean run  -> every resource_change is `no-op`      -> exit 0, silent
# Dirty run  -> at least one update/create/delete      -> report + fail loudly
name: drift

on:
  # The topic teaches an UNATTENDED detector. A detector you have to remember
  # to click is not a detector.
  schedule:
    - cron: "17 3 * * *"          # nightly, 03:17 UTC
  workflow_dispatch:
    inputs:
      environment:
        description: "Which environment root to check"
        required: false
        default: "ci-waf"

permissions:
  contents: read

jobs:
  drift:
    # PER ENVIRONMENT. One entry today; adding envs/staging is a one-line
    # change here rather than a whole new job.
    strategy:
      fail-fast: false
      matrix:
        environment: [ci-waf]
    name: detect drift (envs/${{ matrix.environment }})
    runs-on: ubuntu-latest
    environment: lab-plan          # read-only token is enough to SEE drift
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PLAN }}
      CLOUDFLARE_AUDIT_TOKEN: ${{ secrets.CLOUDFLARE_AUDIT_TOKEN }}
      CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
      LAB_ZONE: ${{ vars.LAB_ZONE }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false   # we need the raw exit code

      - name: locate the live objects to compare against
        id: ids
        run: |
          zid=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=$LAB_ZONE" | jq -r '.result[0].id')
          rs=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$zid/rulesets?per_page=50" \
            | jq -r '.result[]|select(.name=="lab-waf-composed")|.id')
          [ -n "$rs" ] || { echo "::error::lab-waf-composed not found on $LAB_ZONE"; exit 1; }
          echo "ruleset_id=$rs" >> "$GITHUB_OUTPUT"

      - name: plan the live estate against the committed code
        id: plan
        working-directory: infra/envs/${{ matrix.environment }}
        run: |
          terraform init -input=false
          terraform plan -input=false -no-color \
            -var "zone_name=$LAB_ZONE" \
            -var "ruleset_id=${{ steps.ids.outputs.ruleset_id }}" \
            -out=drift.tfplan
          terraform show -json drift.tfplan > drift.json
          # Anything beyond the import itself is drift.
          n=$(jq '[.resource_changes[]? | select(.change.actions | (index("update") or index("create") or index("delete")))] | length' drift.json)
          echo "drifted=$n" >> "$GITHUB_OUTPUT"
          echo "drifted resources: $n"

      - name: report and attribute
        if: steps.plan.outputs.drifted != '0'
        working-directory: infra/envs/${{ matrix.environment }}
        run: python ../../../scripts/drift_report.py drift.json --hours 24 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: clean run
        if: steps.plan.outputs.drifted == '0'
        run: echo "No drift - live matches the committed code." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: fail loudly on drift
        if: steps.plan.outputs.drifted != '0'
        run: |
          echo "::error::DRIFT DETECTED in envs/${{ matrix.environment }} - see the job summary for attribution"
          exit 1
